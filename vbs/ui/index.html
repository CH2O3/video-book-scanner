<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Book Scanner</title>
<style>
:root {
  --bg: #f4f3f0; --panel: #ffffff; --ink: #1f2328; --muted: #6b7178; --line: #dcd9d2;
  --accent: #2f6fdf; --accent-ink: #fff; --accent-soft: #e6eefc;
  --warn: #9a4a06; --warn-bg: #fff1df; --ok: #1d7a46; --ok-bg: #e4f4ea; --bad: #b42318; --bad-bg: #fdecea;
  --chip: #eceae5; --sel: #2f6fdf; --shade: rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181b; --panel: #1f2226; --ink: #e8e6e3; --muted: #9aa0a6; --line: #33373e;
    --accent: #5b8ff0; --accent-soft: #233150; --warn: #f0a35a; --warn-bg: #3a2a18; --ok: #5fcf8e; --ok-bg: #173226;
    --bad: #f28b82; --bad-bg: #3b1d1b; --chip: #2b2f35; --sel: #7aa5ff;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; display: flex; flex-direction: column; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header .brand { font-weight: 700; }
header .title { font-weight: 600; border: 1px solid transparent; background: transparent; color: inherit; padding: 2px 6px; border-radius: 6px; min-width: 10em; font: inherit; }
header .title:hover, header .title:focus { border-color: var(--line); outline: none; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps button { border-radius: 999px; }
.steps button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps .n { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 12px; }
.steps button.active .n { background: rgba(255,255,255,.25); color: inherit; }
.spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.big { padding: 10px 22px; font-size: 16px; }
button.small { padding: 3px 8px; font-size: 12px; }
button.on { background: var(--accent-soft); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--chip); border-radius: 999px; padding: 1px 10px; font-size: 12px; white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
main { flex: 1; min-height: 0; overflow: auto; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.panel h2 { margin: 0 0 10px; font-size: 16px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], select { font: inherit; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input.wide { width: 100%; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 30px 16px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-size: 17px; color: var(--ink); margin-bottom: 4px; }
.filelist { margin: 10px 0 0; padding: 0; list-style: none; }
.filelist li { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
details > summary { cursor: pointer; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
.err { background: var(--bad-bg); color: var(--bad); padding: 10px 14px; border-radius: 10px; margin: 10px 0; white-space: pre-wrap; }
.note { background: var(--ok-bg); color: var(--ok); padding: 10px 14px; border-radius: 10px; margin: 10px 0; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 6px; align-items: center; }
#toast > div { background: #222; color: #fff; padding: 8px 14px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.stages { display: flex; gap: 6px; margin: 10px 0 16px; flex-wrap: wrap; }
.stage { flex: 1; min-width: 110px; padding: 8px 10px; border-radius: 10px; background: var(--chip); color: var(--muted); font-size: 13px; }
.stage.done { background: var(--ok-bg); color: var(--ok); }
.stage.now { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.bar { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); transition: width .3s; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
.stat { background: var(--chip); border-radius: 10px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 22px; }
.review { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.side .filters { padding: 8px; display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.list { overflow: auto; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; flex: 1; }
.item { border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: var(--chip); position: relative; }
.item img { width: 100%; display: block; border-radius: 6px; aspect-ratio: 3 / 4; object-fit: contain; background: #fff; }
.item.spread img { aspect-ratio: 16 / 10; }
.item.sel { border-color: var(--sel); }
.item .cap { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; }
.item .flag { position: absolute; right: 4px; top: 4px; background: var(--warn); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; }
.item .pend { position: absolute; right: 4px; bottom: 4px; background: var(--accent); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; }
.item.excluded { opacity: .45; }
.item.drag-over { outline: 2px dashed var(--accent); }
.detail { overflow: auto; padding: 14px 18px; min-width: 0; }
.dhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.dhead h2 { margin: 0; font-size: 17px; }
.viewer { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; }
.stagebox { background: var(--chip); border-radius: 10px; min-height: 300px; display: flex; align-items: center; justify-content: center; overflow: auto; max-height: calc(100vh - 230px); }
.stagebox img { max-width: 100%; max-height: calc(100vh - 240px); display: block; cursor: zoom-in; }
.stagebox.zoom { align-items: flex-start; justify-content: flex-start; }
.stagebox.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
.tools { display: flex; flex-direction: column; gap: 8px; }
.tools h3 { margin: 6px 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 10px; }
.cand { border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: var(--chip); position: relative; }
.cand img { width: 100%; display: block; border-radius: 6px; }
.cand.cur { border-color: var(--ok); }
.cand.sel { border-color: var(--sel); }
.cand .cap { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; }
.banner { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 13px; }
.modal-bg { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 12px; padding: 16px; max-width: min(1300px, 100%); max-height: 100%; overflow: auto; width: 100%; }
.modal h2 { margin: 0 0 8px; font-size: 16px; }
.geo-wrap { position: relative; display: inline-block; max-width: 100%; user-select: none; }
.geo-wrap img { max-width: 100%; max-height: 68vh; display: block; }
.geo-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
@media (max-width: 900px) { .review { grid-template-columns: 1fr; } .side { max-height: 40vh; } .viewer { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || "";
let S = null, JOB = { running: false }, HOME = { recent: [], default_dir: "" };
let SCREEN = "input";
let FILTER = "review";
let SEL = null;              // { kind: "page" | "segment", id }
let VIEW = "final";          // final | plain | frame
let PREVIEW_FRAME = null;    // 候補を試しに大きく表示しているときのフレームID
let REORDER = false;
let pollTimer = null;
const pending = { files: [], paths: [] };   // 開始前に選んだ動画・写真

// ---------------------------------------------------------------- 小道具
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(3).filter(k => k !== null && k !== undefined && k !== false));
const q = (o) => new URLSearchParams({ ...o, t: TOKEN }).toString();
const fileUrl = (rel, bust = "") => `/files/${rel.split("/").map(encodeURIComponent).join("/")}?${q({ v: bust })}`;
const fmtT = (s) => s == null ? "-" : `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;
function toast(msg, ms = 3500) {
  const d = h("div", {}, msg); $("#toast").append(d); setTimeout(() => d.remove(), ms);
}
async function api(path, body, opts = {}) {
  const r = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, ...(opts.raw ? {} : { "Content-Type": "application/json" }) },
    body: body === undefined ? undefined : (opts.raw ? body : JSON.stringify(body)),
  });
  const txt = await r.text();
  let data = null; try { data = JSON.parse(txt); } catch { data = null; }
  if (!r.ok) { const e = new Error((data && data.error) || `HTTP ${r.status}`); e.actions = data && data.actions; throw e; }
  return data;
}
async function act(body, okMsg) {
  try { S = await api("/api/action", body); if (okMsg) toast(okMsg); render(); return true; }
  catch (e) { showError(e); return false; }
}
function showError(e) {
  modal(h("div", {}, h("h2", {}, "うまくいきませんでした"), h("div", { class: "err" }, String(e.message || e)),
    h("div", { class: "row" }, (e.actions || []).map(a => actionButton(a)), h("div", { class: "spacer" }),
      h("button", { onclick: closeModal }, "閉じる"))));
}
function actionButton(a) {
  return h("button", { class: "primary", onclick: () => { closeModal(); doAction(a.action); } }, a.label);
}
function doAction(name) {
  if (name === "resume") runPipeline();
  else if (name === "goto_input") go("input");
  else if (name === "goto_review") go("review");
  else if (name === "export") exportPdf();
  else if (name === "allow_hdr") runPipeline({ allow_hdr: true });
}

// ---------------------------------------------------------------- 状態
async function load() {
  try {
    HOME = await api("/api/home");
    S = await api("/api/state");
    JOB = await api("/api/job");
    if (S.project) SCREEN = JOB.running ? "progress" : S.project.order.length ? "review" : S.project.videos.length ? "progress" : "input";
    render();
    if (JOB.running) startPoll();
  } catch (e) { render(); showError(e); }
}
function go(screen) { SCREEN = screen; render(); }
function startPoll() {
  if (pollTimer) return;
  let n = 0;
  pollTimer = setInterval(async () => {
    try {
      JOB = await api("/api/job");
      if (++n % 2 === 0 || !JOB.running) S = await api("/api/state");
      if (!JOB.running || !softUpdate()) render();
      if (!JOB.running) {
        clearInterval(pollTimer); pollTimer = null;
        const exp = JOB.result && JOB.result.export;
        if (exp && exp.path) exportDone(exp);
        else if (!JOB.error && !JOB.cancelled && SCREEN === "progress" && JOB.kind !== "export") {
          // 終わったら確認画面へ（要確認があればそこから）
          FILTER = S.review.length ? "review" : "all"; SEL = null; go("review");
        }
      }
    } catch (e) { /* 一時的な失敗は次回に */ }
  }, 800);
}
// 処理中は、画面の作りが変わらない限り数字だけ書き換える（押しかけたボタンや入力中の書名を作り直さない）
let LAST_KEY = "";
function structureKey() {
  return JSON.stringify([SCREEN, JOB.running, JOB.stage, JOB.cancelled, JOB.error, S && S.project && S.project.exports.length]);
}
function softUpdate() {
  const key = structureKey();
  if (key !== LAST_KEY) return false;
  const P = S.project, sm = S.summary;
  const pct = `${Math.round((JOB.frac || 0) * 100)}%`;
  const elapsed = JOB.started ? Math.round(Date.now() / 1000 - JOB.started) : 0;
  const vals = { pct, bar: pct, msg: JOB.msg || "", elapsed: `経過 ${Math.floor(elapsed / 60)}分${elapsed % 60}秒`,
    spreads: P.segments.filter(s => s.include && s.chosen).length, pages: sm.pages, ocr: sm.ocr_done, review: S.review.length };
  for (const el of document.querySelectorAll("[data-live]")) {
    const k = el.dataset.live;
    if (k === "bar") el.style.width = vals.bar; else if (k in vals) el.textContent = vals[k];
  }
  return true;
}
async function runPipeline(extra = {}) {
  try { await api("/api/run", { export: false, ...extra }); JOB = { running: true, msg: "開始", stage: "" }; go("progress"); startPoll(); }
  catch (e) { showError(e); }
}
async function cancelJob() { try { await api("/api/cancel", {}); toast("中断しています…（処理中のページが終わり次第止まります）"); } catch (e) { showError(e); } }

// ---------------------------------------------------------------- ヘッダー
function renderHeader() {
  const P = S && S.project;
  const nReview = P ? S.review.length : 0;
  put($("#hdr"),
    h("span", { class: "brand" }, "📖 Video Book Scanner"),
    P ? h("input", { class: "title", type: "text", value: P.title || "", placeholder: "書名（PDFの名前）",
      onchange: (e) => act({ op: "title", title: e.target.value }) }) : null,
    h("div", { class: "steps" },
      h("button", { class: SCREEN === "input" ? "active" : "", onclick: () => go("input") }, "1 動画を入れる"),
      h("button", { class: SCREEN === "progress" ? "active" : "", disabled: !P, onclick: () => go("progress") },
        "2 処理状況", JOB.running ? h("span", { class: "n", "data-live": "pct" }, `${Math.round((JOB.frac || 0) * 100)}%`) : null),
      h("button", { class: SCREEN === "review" ? "active" : "", disabled: !P || !P.segments.length, onclick: () => go("review") },
        "3 確認してPDFにする", nReview ? h("span", { class: "n" }, nReview) : null)),
    h("div", { class: "spacer" }),
    P ? h("button", { class: "small", title: S.root, onclick: () => api("/api/reveal", { what: "root" }).catch(showError) }, "保存先を開く") : null,
    P ? h("button", { class: "small", disabled: JOB.running, onclick: () => { S = { project: null }; SEL = null; go("input"); } }, "別の本") : null);
}

function render() {
  renderHeader();
  const P = S && S.project;
  const view = !P ? viewInput : { input: viewInput, progress: viewProgress, review: viewReview }[SCREEN] || viewInput;
  put($("#main"), view());
  LAST_KEY = structureKey();
}

// ---------------------------------------------------------------- 1 動画を入れる
function dropZone() {
  const picker = h("input", { type: "file", multiple: true, accept: ".mp4,.mov,.m4v,.mkv,.jpg,.jpeg,.png", style: "display:none",
    onchange: (e) => addFiles([...e.target.files]) });
  const drop = h("div", { class: "drop", onclick: () => picker.click() },
    h("strong", {}, "ここに動画をドラッグ＆ドロップ"),
    "またはクリックして選ぶ（MP4・MOV。足りないページの写真 JPEG・PNG も可）");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles([...e.dataTransfer.files]); });
  const pathIn = h("input", { type: "text", class: "wide", placeholder: "または、ファイルの場所を貼り付けて Enter（例: C:\\Users\\…\\IMG_1234.MOV）。大きな動画はこちらが速い" });
  const addPath = () => {
    for (const line of pathIn.value.split(/\r?\n/)) { const v = line.trim().replace(/^"|"$/g, ""); if (v) pending.paths.push(v); }
    pathIn.value = ""; render();
  };
  pathIn.addEventListener("keydown", (e) => { if (e.key === "Enter") addPath(); });
  const items = [...pending.files.map((f, i) => ({ name: f.name, size: f.size, rm: () => pending.files.splice(i, 1) })),
    ...pending.paths.map((p, i) => ({ name: p, size: null, rm: () => pending.paths.splice(i, 1) }))];
  const list = items.length ? h("ul", { class: "filelist" }, items.map(it => h("li", {},
    h("span", {}, /\.(jpe?g|png)$/i.test(it.name) ? "🖼️" : "🎞️"), h("span", { style: "flex:1;word-break:break-all" }, it.name),
    it.size ? h("span", { class: "muted" }, `${(it.size / 2 ** 20).toFixed(0)} MB`) : null,
    h("button", { class: "small", onclick: () => { it.rm(); render(); } }, "外す")))) : null;
  return { el: [drop, picker, h("div", { class: "row", style: "margin-top:8px" }, h("div", { style: "flex:1" }, pathIn), h("button", { onclick: addPath }, "追加")), list], items };
}

function viewInput() {
  const P = S && S.project;
  const wrap = h("div", { class: "wrap" });
  const dz = dropZone();
  const items = dz.items;

  if (P) {
    wrap.append(h("div", { class: "panel" }, h("h2", {}, "この本の動画"),
      P.videos.length ? h("ul", { class: "filelist" }, P.videos.map((v, i) => h("li", {},
        h("span", {}, `${i + 1}.`), h("span", { style: "flex:1" }, v.original_name),
        h("span", { class: "muted" }, `${Math.round(v.duration_sec || 0)}秒`),
        v.analysis ? h("span", { class: "chip ok" }, "解析済み") : h("span", { class: "chip warn" }, "未処理"),
        P.videos.length > 1 ? h("button", { class: "small", title: "撮った順が違うときに", disabled: i === 0 || JOB.running, onclick: () => act({ op: "move_video", video: v.id, delta: -1 }, "順番を変えました") }, "↑ 前へ") : null,
        v.analysis ? h("button", { class: "small", disabled: JOB.running, onclick: () => act({ op: "rotate_video", video: v.id, k: 1 }, "この動画のページを左に90°回しました。「処理を再開する」で作り直します") }, "⟲ ページの向きを回す") : null))) : h("p", { class: "muted" }, "まだありません"),
      P.videos.some(v => v.analysis) ? h("p", { class: "muted", style: "font-size:12px" }, "ページが横倒し・逆さまになっていたら「ページの向きを回す」を押してください（1回で左に90°）。") : null,
      h("p", { class: "muted", style: "margin-top:14px" }, "動画や写真を追加する（続きを撮った動画、撮り直したページの写真など）"),
      dz.el,
      h("div", { class: "row", style: "margin-top:12px" },
        h("button", { class: "primary big", disabled: JOB.running || (!items.length && !needsWork()), onclick: addToProject },
          items.length ? "追加して処理する" : "処理を再開する"),
        P.order.length ? h("button", { onclick: () => go("review") }, "確認画面へ") : null)));
    return wrap;
  }

  const firstName = items.length ? items[0].name.split(/[\\/]/).pop().replace(/\.[^.]+$/, "") : "";
  const tv = pending.title ?? firstName;
  const dest = h("input", { type: "text", class: "wide", value: pending.dest ?? joinPath(HOME.default_dir, safe(tv || "book")),
    oninput: (e) => { pending.dest = e.target.value; } });
  const title = h("input", { type: "text", class: "wide", value: tv, placeholder: "書名（PDFの名前）",
    oninput: (e) => { pending.title = e.target.value; if (pending.dest == null) dest.value = joinPath(HOME.default_dir, safe(e.target.value || "book")); } });

    [["final", "補正後"], ["plain", "補正前（切り抜きだけ）"], ["frame", "元の映像"]].map(([k, t]) => h("button", { class: VIEW === k ? "on" : "", onclick: () => { VIEW = k; render(); } }, t))),
    h("span", { class: "muted", style: "font-size:12px" }, "画像クリックで拡大")) : null;

  const cands = seg.candidates.length ? h("div", {},
    h("h3", { style: "margin:14px 0 0;font-size:14px" }, `この見開きの候補（${seg.candidates.length}）`,
      h("span", { class: "muted", style: "font-weight:400;font-size:12px" }, "　クリックで大きく表示。指が入っていないものを選んでください")),
    h("div", { class: "cands" }, seg.candidates.map(fid => {
      const f = frameOf(fid);
      return h("div", { class: "cand " + (fid === seg.chosen && seg.include ? "cur " : "") + (fid === PREVIEW_FRAME ? "sel" : ""), onclick: () => { PREVIEW_FRAME = fid; render(); } },
        h("img", { src: fileUrl(f.thumb), loading: "lazy" }),
        h("span", { class: "cap" }, `${f.source === "photo" ? "写真" : fmtT(f.time_sec)}${fid === seg.chosen && seg.include ? " ✓使用中" : ""}`));
    }))) : null;

  const opts = S.page_options[seg.id] || {};
  const optBtn = (key, val, label) => h("button", { class: opts[key] === val ? "on" : "", onclick: () => { if (opts[key] !== val) act({ op: "page_options", segment: seg.id, values: { [key]: val } }, "変えました。「変更を反映」で作り直します"); } }, label);
  const tools = h("div", { class: "tools" },
    h("h3", {}, "フレームを替える"),
    seg.video_id ? h("button", { onclick: () => openFramePicker(seg) }, "動画で前後のコマを探す…") : null,
    h("button", { onclick: () => pickPhoto(seg.id) }, "写真を追加する…"),
    seg.chosen && page ? [h("h3", {}, "切り抜き"),
      h("button", { onclick: () => openGeometry(seg) }, "分割線・切り抜きを直す…"),
      seg.manual_geometry ? h("button", { class: "small", onclick: () => act({ op: "clear_geometry", segment: seg.id }, "自動に戻しました") }, "自動の切り抜きに戻す") : null,
      h("h3", {}, "補正（この見開きだけ）"),
      h("div", { class: "seg" }, optBtn("dewarp", "auto", "湾曲補正する"), optBtn("dewarp", "off", "しない")),
      h("div", { class: "seg" }, optBtn("margins", "content_box", "余白を白に"), optBtn("margins", "off", "そのまま"))] : null,
    h("h3", {}, "使う・使わない"),
    page ? h("button", { onclick: () => act({ op: "include", id: page.id, value: !page.include }, page.include ? "除外しました" : "戻しました") }, page.include ? "このページを除外" : "このページを戻す") : null,
    page && sameSeg.length > 1 && seg.include ? h("button", { class: "small", onclick: () => act({ op: "include", id: seg.id, value: false }, "見開きごと除外しました") }, "見開きごと除外") : null,
    !page ? h("button", { class: "primary", disabled: !seg.candidates.length, onclick: () => adoptSegment(seg) }, "この区間を採用する") : null,
    reasons.length ? h("button", { onclick: () => ackAll(page, seg) }, "問題なし（確認済みにする）") : null,
    page && page.ocr && page.ocr.error ? h("button", { onclick: () => act({ op: "image_only", page: page.id, value: true }, "画像だけで残します") }, "文字なし（画像だけ）で残す") : null,
    page && page.ocr && page.ocr.txt ? h("button", { class: "small", onclick: () => showOcr(page) }, "認識した文字を見る") : null);

  return h("div", {}, head, h("div", { class: "viewer" }, h("div", { style: "min-width:0" }, banner, viewBtns, stage, cands), tools));
}
async function useCandidate(seg, fid) {
  PREVIEW_FRAME = null;
  await act({ op: "choose", segment: seg.id, frame: fid }, "候補を差し替えました。「変更を反映」で作り直します");
}
async function adoptSegment(seg) {
  if (PREVIEW_FRAME && PREVIEW_FRAME !== seg.chosen) await act({ op: "choose", segment: seg.id, frame: PREVIEW_FRAME });
  PREVIEW_FRAME = null;
  await act({ op: "include", id: seg.id, value: true }, "採用しました。「変更を反映」でページを作ります");
}
async function ackAll(page, seg) {
  const rv = reviewMap();
  if (page && rv[page.id] && !(await act({ op: "ack", id: page.id }))) return;
  if (rv[seg.id]) await act({ op: "ack", id: seg.id });
  toast("確認済みにしました");
}
async function showOcr(page) {
  const r = await fetch(fileUrl(page.ocr.txt)); const t = await r.text();
  modal(h("div", {}, h("h2", {}, "認識した文字（PDFに埋め込まれる文字）"), h("pre", { style: "white-space:pre-wrap;max-height:65vh;overflow:auto;background:var(--chip);padding:10px;border-radius:8px" }, t),
    h("div", { class: "row" }, h("div", { class: "spacer" }), h("button", { onclick: closeModal }, "閉じる"))));
}
function pickPhoto(afterSeg) {
  const inp = h("input", { type: "file", accept: ".jpg,.jpeg,.png", multiple: true });
  inp.onchange = async () => {
    for (const f of inp.files) {
      try { S = await uploadOne(f, { after: afterSeg }, f.name); }
      catch (e) { render(); showError(e); return; }
    }
    render();
    toast("写真を追加しました（この見開きの後ろに入ります）。不要になった元のページは除外してください", 6000);
  };
  inp.click();
}

document.addEventListener("keydown", (e) => {
  if (SCREEN !== "review" || $("#modal").children.length || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const items = itemsFor(FILTER); const i = items.findIndex(it => SEL && it.id === SEL.id);
  const j = Math.max(0, Math.min(items.length - 1, i + (e.key === "ArrowRight" ? 1 : -1)));
  if (items[j]) { SEL = { kind: items[j].kind, id: items[j].id }; PREVIEW_FRAME = null; render(); }
  e.preventDefault();
});

// ---------------------------------------------------------------- PDF出力
function ask(title, body, okLabel) {
  return new Promise((resolve) => {
    let done = false;
    const fin = (v) => { if (!done) { done = true; resolve(v); } };
    modal(h("div", {}, h("h2", {}, title), body,
      h("div", { class: "row", style: "margin-top:12px" }, h("div", { class: "spacer" }),
        h("button", { onclick: () => closeModal() }, "やめる"),
        h("button", { class: "primary", onclick: () => { fin(true); closeModal(); } }, okLabel))),
      () => fin(false));
  });
}
async function exportPdf() {
  const nPend = S.pending.length, nRev = S.review.length;
  if (nPend || nRev) {
    const body = h("div", {},
      nPend ? h("p", {}, `未反映の変更が ${nPend} 件あります。先に反映（変えた見開きだけ作り直し）してから出力します。`) : null,
      nRev ? [h("p", {}, `要確認が ${nRev} 件残っています。このまま出力すると、これらもそのままPDFに入ります。`),
        h("ul", { style: "margin:0;max-height:30vh;overflow:auto" }, S.review.map(it => {
          const pg = S.project.pages[it.id];
          const where = pg ? `${S.project.order.indexOf(it.id) + 1}ページ目` : it.kind === "segment" ? `${fmtT((segOf(it.id) || {}).start_sec)} の見開き` : "";
          return h("li", {}, `${where} ${it.labels.join("、")}`);
        }))] : null);
    if (!(await ask(nRev ? "要確認が残っています" : "PDFを出力", body, nRev ? "このまま出力する" : "反映して出力する"))) return;
  }
  try {
    if (nPend) await api("/api/run", { export: true, force: nRev > 0 });
    else await api("/api/export", { force: nRev > 0 });
    JOB = { running: true, msg: "PDFを作っています", stage: nPend ? "split" : "export" }; go("progress"); startPoll();
  } catch (e) { showError(e); }
}
function exportDone(rec) {
  modal(h("div", {}, h("h2", {}, "PDFができました"), h("p", { style: "word-break:break-all" }, rec.path),
    h("p", { class: "muted" }, `${rec.pages}ページ。保存したファイルを開き直して、ページ数と文字層があることを確かめました。`),
    h("div", { class: "row" }, h("button", { class: "primary", onclick: () => api("/api/reveal", { what: "pdf" }).catch(showError) }, "PDFを開く"),
      h("button", { onclick: () => api("/api/reveal", { what: "output" }).catch(showError) }, "フォルダを開く"), h("div", { class: "spacer" }),
      h("button", { onclick: () => { closeModal(); go("review"); } }, "閉じる"))));
}

// ---------------------------------------------------------------- モーダル
let modalCleanup = null;
function modal(content, cleanup) {
  if (modalCleanup) modalCleanup();
  modalCleanup = cleanup || null;
  const bg = h("div", { class: "modal-bg", onclick: (e) => { if (e.target === bg) closeModal(); } }, h("div", { class: "modal" }, content));
  put($("#modal"), bg);
}
function closeModal() { put($("#modal")); if (modalCleanup) { const c = modalCleanup; modalCleanup = null; c(); } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#modal").children.length) closeModal(); });

function openFramePicker(seg) {
  const P = S.project;
  const v = P.videos.find(x => x.id === seg.video_id);
  const cf = seg.chosen ? frameOf(seg.chosen) : null;
  let t = cf && cf.time_sec != null ? cf.time_sec : seg.start_sec;
  const img = h("img", { style: "max-width:100%;max-height:60vh;display:block;margin:auto;background:var(--chip)" });
  const lbl = h("b", {});
  const range = h("input", { type: "range", min: 0, max: v.duration_sec || 1, step: 0.01, value: t, style: "flex:1;min-width:200px" });
  let busy = false, timer = null, url = null;
  const show = async (target, step = 0) => {
    busy = true; lbl.textContent = "読み込み中…";
    try {
      const r = await fetch(`/api/preview?${q({ video: v.id, time: target, step, w: 1280 })}`, { headers: { "X-Token": TOKEN } });
      if (!r.ok) throw new Error((await r.json()).error);
      t = parseFloat(r.headers.get("X-Frame-Time")); range.value = t;
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(await r.blob()); img.src = url;
      const inside = t >= seg.start_sec - 0.01 && t <= seg.end_sec + 0.01;
      lbl.textContent = `${fmtT(t)}　${inside ? "（ページが止まっている区間の中）" : "（区間の外）"}`;
    } catch (e) { lbl.textContent = String(e.message || e); }
    busy = false;
  };
  range.oninput = () => { clearTimeout(timer); timer = setTimeout(() => show(parseFloat(range.value)), 200); };
  const stepBtn = (label, step, sec) => h("button", { onclick: () => { if (!busy) show(sec ? Math.max(0, t + sec) : t, step); } }, label);
  const keys = (e) => {
    if (busy) return;
    if (e.key === "ArrowRight") { e.preventDefault(); show(t, 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); show(t, -1); }
  };
  document.addEventListener("keydown", keys);
  modal(h("div", {},
    h("h2", {}, `動画で探す（${fmtT(seg.start_sec)}〜${fmtT(seg.end_sec)} の見開き）`),
    h("p", { class: "muted", style: "margin-top:0" }, "指や影が文字にかかっていないコマを探して「このコマを使う」。← → キーで1コマずつ動きます。"),
    img,
    h("div", { class: "row", style: "margin-top:10px" }, stepBtn("◀◀ 1秒", 0, -1), stepBtn("◀ 1コマ", -1), range, stepBtn("1コマ ▶", 1), stepBtn("1秒 ▶▶", 0, 1)),
    h("div", { class: "row", style: "margin-top:10px" }, lbl, h("div", { class: "spacer" }),
      h("button", { class: "primary", onclick: async () => { if (busy) return; const ok = await act({ op: "add_frame", video: v.id, t, segment: seg.id }, "このコマを使います。「変更を反映」で作り直します"); if (ok) { PREVIEW_FRAME = null; closeModal(); } } }, "このコマを使う"),
      h("button", { onclick: closeModal }, "キャンセル"))),
    () => { document.removeEventListener("keydown", keys); if (url) URL.revokeObjectURL(url); });
  show(t);
}

function openGeometry(seg) {
  const P = S.project, f = frameOf(seg.chosen);
  const g0 = (seg.manual_geometry && seg.manual_geometry.frame_id === seg.chosen) ? seg.manual_geometry
    : (seg.geometry && seg.geometry.frame_id === seg.chosen ? seg.geometry : null);
  const W = f.width, H = f.height;
  let bbox = g0 && g0.bbox ? [...g0.bbox] : [0, 0, W, H];
  const spread = P.settings.layout === "spread";
  let gutter = g0 && g0.gutter_x != null ? g0.gutter_x : Math.round((bbox[0] + bbox[2]) / 2);
  let mode = spread ? "gutter" : "bbox";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  const draw = () => {
    svg.innerHTML = `<rect x="${bbox[0]}" y="${bbox[1]}" width="${bbox[2] - bbox[0]}" height="${bbox[3] - bbox[1]}" fill="none" stroke="#2f6fdf" stroke-width="${W / 250}"/>` +
      (spread ? `<line x1="${gutter}" x2="${gutter}" y1="${bbox[1]}" y2="${bbox[3]}" stroke="#e5484d" stroke-width="${W / 300}"/>` : "");
  };
  draw();
  const pt = (e) => { const r = svg.getBoundingClientRect(); return [Math.max(0, Math.min(W, Math.round((e.clientX - r.left) / r.width * W))), Math.max(0, Math.min(H, Math.round((e.clientY - r.top) / r.height * H)))]; };
  let start = null;
  svg.addEventListener("pointerdown", (e) => { const p = pt(e); svg.setPointerCapture(e.pointerId); if (mode === "gutter") { gutter = p[0]; draw(); start = "g"; } else start = p; });
  svg.addEventListener("pointermove", (e) => {
    if (!start) return; const p = pt(e);
    if (start === "g") gutter = p[0];
    else bbox = [Math.min(start[0], p[0]), Math.min(start[1], p[1]), Math.max(start[0], p[0]), Math.max(start[1], p[1])];
    draw();
  });
  svg.addEventListener("pointerup", () => { start = null; });
  const modeBtns = h("div", { class: "seg" });
  const upd = () => put(modeBtns,
    spread ? h("button", { class: mode === "gutter" ? "on" : "", onclick: () => { mode = "gutter"; upd(); } }, "分割線（赤）をクリック・ドラッグで置く") : null,
    h("button", { class: mode === "bbox" ? "on" : "", onclick: () => { mode = "bbox"; upd(); } }, "紙の範囲（青）をドラッグで囲む"));
  upd();
  modal(h("div", {},
    h("h2", {}, "分割線・切り抜きを直す"),
    h("div", { class: "row", style: "margin-bottom:8px" }, modeBtns),
    h("div", { class: "geo-wrap" }, h("img", { src: fileUrl(f.path), draggable: "false" }), svg),
    h("div", { class: "row", style: "margin-top:10px" },
      h("span", { class: "muted" }, "この候補を使っている間は、自動処理で上書きされません。"), h("div", { class: "spacer" }),
      h("button", { class: "primary", onclick: async () => {
        if (bbox[2] - bbox[0] < W / 10 || bbox[3] - bbox[1] < H / 10) { toast("範囲が小さすぎます"); return; }
        if (spread && (gutter <= bbox[0] || gutter >= bbox[2])) { toast("分割線が紙の範囲の外です"); return; }
        const ok = await act({ op: "geometry", segment: seg.id, bbox, gutter_ratio: spread ? gutter / W : null }, "保存しました。「変更を反映」でこの見開きだけ作り直します");
        if (ok) closeModal();
      } }, "保存"),
      h("button", { onclick: closeModal }, "キャンセル"))));
}

load();
</script>
