[project]
name = "video-book-scanner"
version = "0.1.0"
description = "ページめくり動画から見開きを抽出し、検索可能PDFを作る"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "av>=14",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pypdf>=5.0",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vbs = "vbs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vbs*"]

[tool.setuptools.package-data]
vbs = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
